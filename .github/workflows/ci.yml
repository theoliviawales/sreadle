name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Validate patterns and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild patterns.json and fail if it is out of date
        run: |
          node scripts/build-patterns.mjs
          if ! git diff --exit-code -- patterns.json; then
            echo "::error::patterns.json is out of date with patterns/. Run 'node scripts/build-patterns.mjs' (or scripts/publish-pattern.mjs) and commit the result."
            exit 1
          fi

      - name: Run the test suite
        run: npm test

# Deployment is handled by Cloudflare Pages' own Git integration: every push
# to main deploys automatically once this workflow's checks pass on the
# commit. This workflow is the quality gate (patterns freshness plus the
# full test suite), not the deployer.
